# Catégories de tâches (préfixe du titre, ex. « [Cha] Mail aux alumni ») et les mots qui les désignent.
# Quand un message parle d'un de ces mots (« rajoute dans chaps… »), la tâche reçoit le préfixe : elle se range dans
# son domaine (couleur, priorités). Complète à ta guise : code (tel qu'écrit entre crochets), nom, surnoms.
Cha:
  name: CHAPS (association de rugby)
  aliases: [chaps, chap's, chapsettes, asso rugby, association de rugby]
Esp:
