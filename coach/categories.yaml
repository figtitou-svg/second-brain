  aliases: [anglais, cours d'anglais]
Fra:
  name: Franck (Nomana IT)
  aliases: [franck, nomana]
Job:
  name: Job, candidatures, Compagnons
  aliases: [job, compagnons]
Per:
  name: Perso
  aliases: [perso, personnel, administratif perso]
Cyber:
  name: Cyber
  aliases: [cyber, cybersécurité, hack the box, htb]
Sec+:
  name: Security+
  aliases: [security+, security plus, sec+, comptia]
Alg:
  name: Algorithmique
  aliases: [algo, algorithmique]
Pro:
  name: Programmation
  aliases: [programmation, prog]
BDE:
  name: BDE
  aliases: [bde]
EPS:
