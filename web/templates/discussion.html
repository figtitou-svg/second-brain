{% extends "base.html" %}
{% block title %}Discussion · Second Brain{% endblock %}
{% block main %}
<h1>Discussion</h1>
<div id="thread" class="thread" aria-live="polite">{% for ex in exchanges %}{% include "_exchange.html" %}{% endfor %}</div>
<div class="shortcuts" aria-label="Commandes">{% for name, desc in commands %}<button type="button" data-say="/{{ name }}" title="{{ desc }}">/{{ name }}</button>{% endfor %}</div>
<form class="composer" data-say-form data-target="#thread">
  <label class="sr-only" for="say">Message ou /commande</label>
  <input id="say" name="text" placeholder="Message ou /commande" autocomplete="off" autofocus>
  <button type="submit">Envoyer</button>
</form>
{% endblock %}
